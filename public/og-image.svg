<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="0.5" stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="0%" r="70%">
      <stop offset="0" stop-color="#8b5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- monogram -->
  <rect x="80" y="80" width="96" height="96" rx="24" fill="url(#accent)"/>
  <text x="128" y="138" text-anchor="middle" dominant-baseline="central"
        font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="48" font-weight="700" fill="#06070d">FM</text>

  <!-- name + role -->
  <text x="80" y="320" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="86" font-weight="700" fill="#e7edf7">Farid Mitri</text>
  <text x="80" y="395" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="42" font-weight="600" fill="url(#accent)">Lead Data Engineer &amp; Cloud Architect</text>
  <text x="80" y="455" font-family="'Inter','Segoe UI',sans-serif" font-size="28" fill="#97a3ba">Large-scale data &amp; AI platforms on Google Cloud</text>

  <!-- tags -->
  <g font-family="'JetBrains Mono',monospace" font-size="22" fill="#97a3ba">
    <g>
      <rect x="80" y="510" width="180" height="48" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="170" y="540" text-anchor="middle">Generative AI</text>
    </g>
    <g>
      <rect x="280" y="510" width="150" height="48" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="355" y="540" text-anchor="middle">Vertex AI</text>
    </g>
    <g>
      <rect x="450" y="510" width="150" height="48" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="525" y="540" text-anchor="middle">BigQuery</text>
    </g>
    <g>
      <rect x="620" y="510" width="200" height="48" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="720" y="540" text-anchor="middle">GCP Certified</text>
    </g>
  </g>
</svg>
